name: Run Tests

on: [push]


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.4

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...